services:

  # ── 0. Postgres ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: respotit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     spotify
      POSTGRES_PASSWORD: spotify
      POSTGRES_DB:       spotify
    volumes:
      # Bind-mount every volume into the project folder (no named volumes).
      - ./docker-data/postgres:/var/lib/postgresql/data
    ports:
      # Host 5433: the elixir tree's Postgres already owns host 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotify"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 1. FastAPI — all backend functionality ────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.api
    image: spotify-api
    env_file: .env
    environment:
      DATABASE_URL:   postgresql://spotify:spotify@db:5432/spotify
      OUTPUT_CSV:     /data/spotify_albums.csv
      INPUT_CSV:      /data/spotify_albums.csv
      IMAGES_DIR:     /data/images
      MIGRATIONS_DIR: /app/migrations
      REDIRECT_URI:   ${REDIRECT_URI:-https://127.0.0.1:8000/api/v1/auth/callback}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://127.0.0.1:8000}
      SSL_ENABLED:    ${SSL_ENABLED:-true}
    ports:
      - "8000:8000"              # API on all interfaces (phone reaches it over the LAN)
    volumes:
      - ./data:/data
      - ./server/api:/app/api                # live-reload in dev
      - ./server/migrations:/app/migrations  # new migration files without rebuilds
      - ./certs:/app/certs:ro                # mkcert server cert + key (optional)
      - ./server/entrypoint.sh:/app/entrypoint.sh:ro
    # SSL_ENABLED=true (default) serves HTTPS; set SSL_ENABLED=false for plain HTTP.
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import ssl,urllib.request; ctx=ssl._create_unverified_context()\nfor u in ('https://127.0.0.1:8000/api/v1/health','http://127.0.0.1:8000/api/v1/health'):\n try:\n  urllib.request.urlopen(u,context=ctx);break\n except Exception:pass\nelse:raise SystemExit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. React frontend — served via nginx ──────────────────────────────────
  frontend:
    build:
      context: ./server/frontend
      dockerfile: Dockerfile
    image: spotify-frontend
    ports:
      - "8888:80"                         # visit http://127.0.0.1:8888 (Docker Desktop binds to localhost only)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - api
    restart: unless-stopped

# Volumes are bind-mounted into ./docker-data/ (see the volume entries above),
# so every piece of state lives inside the project folder. No named volumes.