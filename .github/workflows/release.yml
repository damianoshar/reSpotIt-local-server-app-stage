name: Release Windows Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: server/frontend
        run: |
          npm install
          npm run build
          npm run verify:local

      - name: Install Python deps
        run: pip install -r server/requirements.api.txt -r desktop/requirements.txt

      - name: Run tests
        working-directory: server
        run: python -m pytest tests -q

      - name: Build desktop exe
        working-directory: desktop
        run: pyinstaller spotify-dashboard.spec --noconfirm

      - name: Package release
        shell: pwsh
        run: |
          $zip = "reSpotIt-Windows.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "desktop/dist/reSpotIt/*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Set-Content -Path "SHA256SUMS.txt" -Encoding ASCII
          Write-Host "SHA256: $hash"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reSpotIt-Windows
          path: |
            reSpotIt-Windows.zip
            SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            reSpotIt-Windows.zip
            SHA256SUMS.txt
          generate_release_notes: true
